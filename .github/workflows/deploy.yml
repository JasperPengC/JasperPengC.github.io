name: Deploy PPClash website

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pages repository
        uses: actions/checkout@v4

      - name: Checkout website source
        run: git clone --depth 1 --branch main https://github.com/JasperPengC/ppclash-website.git website

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci
        working-directory: website

      - name: Build site
        run: npm run build
        working-directory: website
        env:
          VITEPRESS_BASE: /ppclash/
          GITHUB_TOKEN: ${{ github.token }}

      - name: Package site under /ppclash
        run: |
          mkdir -p _site/ppclash
          cp -a website/docs/.vitepress/dist/. _site/ppclash/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
